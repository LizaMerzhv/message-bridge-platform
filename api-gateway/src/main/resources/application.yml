spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/message-bridge}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/message-bridge/protocol/openid-connect/certs}
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        - id: block-internal
          uri: no://op
          predicates:
            - Path=/internal/**
          filters:
            - SetStatus=403

        - id: admin-route
          uri: ${ADMIN_SERVICE_URL:http://admin-service:8090}
          predicates:
            - Path=/admin/**

        - id: docs-route
          uri: ${API_SERVICE_URL:http://notification-api-service:8080}
          predicates:
            - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

        - id: api-route
          uri: ${API_SERVICE_URL:http://notification-api-service:8080}
          predicates:
            - Path=/api/**
